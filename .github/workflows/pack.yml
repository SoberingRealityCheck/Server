# Builds the modpack, keeps MODLIST.md current, and publishes a release
# whenever pack.yaml's version changes.
#
# The whole workflow is driven by one field: `version` in
# minecraft/pack.yaml.
#
#   Change mods, same version   -> builds, verifies, updates MODLIST.md
#   Change mods, bump version   -> all of the above, then cuts a release
#
# There is no separate tagging step. Tagging by hand was the old design
# and it was the wrong one: the tag could disagree with pack.yaml, and
# forgetting it meant no release ever appeared. Here the tag is derived
# from the manifest, so the two cannot drift.
#
# Cutting a release:
#   1. bump `version` in minecraft/pack.yaml
#   2. commit and push to the default branch
#
# That is the entire procedure.

name: pack

# No `paths` filter. It saved a little CI time and cost a lot of
# comprehensibility -- path filters are silently ignored for tag pushes,
# which made the old trigger logic subtle enough to need a paragraph of
# explanation. A cached build is fast; predictable is worth more.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # commit MODLIST.md, create releases

concurrency:
  # Two pushes in quick succession would otherwise race to commit
  # MODLIST.md and to create the same tag.
  group: pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release step needs to know whether
          # this version has already been published.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      # Cache downloaded jars, keyed by pack.yaml's contents. Change a
      # pinned hash and the key changes with it, so a stale jar can never
      # be reused for a new pin.
      - name: Restore artifact cache
        uses: actions/cache@v4
        with:
          path: minecraft/.cache
          key: mods-${{ hashFiles('minecraft/pack.yaml') }}

      # build.py is a uv script -- dependencies are declared inline in its
      # header, so uv provisions them. Plain `python3` would lack PyYAML.
      - name: Build pack
        working-directory: minecraft
        run: uv run --script build.py

      # Reads each jar's real fabric.mod.json and resolves the same
      # constraints Fabric checks at launch, per side. Catches version
      # conflicts and env mistakes here rather than in a restart loop on
      # the server.
      - name: Check Fabric dependencies
        working-directory: minecraft
        run: uv run --script build.py --check-deps

      # MODLIST.md is generated from pack.yaml, so CI regenerates and
      # commits it rather than failing and asking a human to do it. Only
      # on the default branch: pull_request runs check out a merge commit
      # and forks cannot push.
      - name: Sync MODLIST.md
        id: modlist
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        run: |
          if git diff --quiet -- minecraft/MODLIST.md; then
            echo "MODLIST.md already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add minecraft/MODLIST.md
            # [skip ci] stops this commit from triggering another run.
            # The release below happens in *this* run, so nothing is lost.
            git commit -m "chore: regenerate MODLIST.md [skip ci]"
            git push
            echo "MODLIST.md updated and pushed"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Downloadable from the run summary. Makes a manual "Run workflow"
      # or a PR build useful without cutting a release.
      - name: Upload pack as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack.mrpack
          path: minecraft/dist/pack.mrpack
          if-no-files-found: warn
          retention-days: 14

      # A release is cut when pack.yaml names a version that has no tag
      # yet. Re-running on an already-released version is a no-op rather
      # than an error, which keeps re-runs safe.
      - name: Determine release need
        id: ver
        run: |
          version=$(uv run --with pyyaml python -c \
            "import yaml; print(yaml.safe_load(open('minecraft/pack.yaml'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released -- nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no tag yet -- a release will be created."
          fi

      - name: Stage release assets
        if: >-
          steps.ver.outputs.needed == 'true' &&
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        run: |
          # Version the filename so players can tell downloads apart, and
          # ship the freshly generated MODLIST rather than the committed
          # copy, which is guaranteed current here but need not be.
          cp minecraft/dist/pack.mrpack \
             "minecraft/dist/elysium-${{ steps.ver.outputs.version }}.mrpack"
          cp minecraft/MODLIST.md minecraft/dist/MODLIST.md

      - name: Publish release
        if: >-
          steps.ver.outputs.needed == 'true' &&
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          # Point the tag at the MODLIST commit when there was one, so the
          # tagged tree matches the published assets.
          target_commitish: ${{ steps.modlist.outputs.sha || github.sha }}
          files: |
            minecraft/dist/elysium-${{ steps.ver.outputs.version }}.mrpack
            minecraft/dist/MODLIST.md
          generate_release_notes: true
          body: |
            Minecraft modpack for the Elysium server.

            **Install:** download the `.mrpack` below, then

            - **Modrinth App** — Add Instance → From File
            - **Prism Launcher** — Add Instance → Import

            Your launcher installs Fabric and every client-side mod
            automatically. `MODLIST.md` below lists everything included.
