# Coast assignments for profiled ecoregions (art-direction coastal pass, 2026-10-28).
# Hand-authored. A region lists one or more coast types with a share. Where a region has several,
# they should alternate along the shore in stretches of hundreds of blocks (noise), not mix block by block.
# sea: nearshore water colour (shallow) and offshore (sea). Estimates, to be replaced by photo picks.
# Types (see the briefs page, section "Coasts"):
#   sandy       A  sandy barrier, beach, dune ridge with grass, back-barrier lagoon or marsh
#   chalk       B  white chalk cliffs over a narrow flint-gravel beach
#   granite     C  granite boulders, skerries and small sandy coves
#   limestone   D  white limestone cliffs and ledges, pebble coves, very clear water
#   marsh       E  salt marsh, mudflats, tidal creeks; no beach
#   shingle     F  steep gravel and cobble beach
#   fjord       G  steep rock straight into deep dark water; forest to the waterline
#   volcanic    H  black sand and basalt
#   white_sand  I  tropical white sand, turquoise shallows
#   desert      J  sand and dunes running into clear sea, sparse or no plants
#   sandstone   K  orange or red sandstone cliffs with sea stacks and golden coves
#   arctic      L  gravel beach ridges, snow, sea ice offshore
#   pacific     M  dark sand, basalt headlands and stacks, driftwood logs, forest behind

