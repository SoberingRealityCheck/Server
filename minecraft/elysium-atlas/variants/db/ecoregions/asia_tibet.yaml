# The Tibetan Plateau and the high Himalaya: treeless alpine meadow, steppe and desert.
# The placement puts fir clearings and hemlock treelines on parts of the plateau; these profiles keep it treeless.
# Schema: see ../README.md.

768:
  name: Tibetan Alpine Meadow
  resolve: "Tibetan Plateau alpine shrublands and meadows"
  ground: {kobresia: 4, shrubby_cinquefoil: 1, dwarf_rhododendron: 0.5}
  flowers: {tibetan_gentian: 1, blue_poppy: 0.5, tibetan_edelweiss: 0.5}
  ground_surface:
    geology: "Plateau sediments under thin turf."
    rock: [stone]
    outcrops: few
    soil: {gravel: few, coarse_dirt: few}
  why: "Kobresia turf grazed by yaks, cinquefoil shrubs and gentians; no trees."

