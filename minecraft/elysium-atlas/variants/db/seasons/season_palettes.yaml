# Explicit season palettes (ask 20), hand-authored from the briefs, 2026-10-28.
# Keys: Serene Seasons subseasons. Temperate: early_spring .. late_winter; tropical: early_wet .. late_dry.
# Give at least the mid subseasons; the client lerps between the ones given. A leaf block not listed keeps today's
# behaviour (biome foliage + Serene Seasons overlay). "bare" means the block should read as leafless: a grey-brown
# twig colour here, or a leaf-block swap to nothing once ask 2 exists.
# Values are estimates from knowledge of each place, to be replaced by eyedropper picks from reference photos.

391:  # Hill Country (parent savanna: tropical regime today; proposed temperate, see ask 21)
  regime: temperate
  grass:        {mid_spring: "#8fa65a", mid_summer: "#a8a666", late_summer: "#b3a274", mid_autumn: "#a8a070", mid_winter: "#a89c74"}
  wilderwild:cypress_leaves: {all: "#36463a", mid_winter: "#3a4636"}             # Ashe juniper, slightly browner in winter (pollen)
  minecraft:oak_leaves:      {all: "#42602e", early_spring: "#6a8a3a"}           # live oak: evergreen, brief flush in March
  minecraft:acacia_leaves:   {mid_spring: "#5b7f3c", mid_summer: "#56783a", mid_autumn: "#8a6a3a", mid_winter: "#7a5a3a"}   # shin/Texas oak
  biomesoplenty:cypress_leaves: {mid_spring: "#86b04a", mid_summer: "#7aa048", mid_autumn: "#a0522d", mid_winter: bare}       # bald cypress: rust, then bare
  minecraft:jungle_leaves:   {mid_spring: "#6aa83c", mid_summer: "#5e9a3c", mid_autumn: "#b09030", mid_winter: bare}       # pecan, sycamore: yellow

