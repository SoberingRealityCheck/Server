# Per-region season classes for the derived palettes (2026-10-28). Edit here, then rerun derive.py.
# phase: when the year's keys fall on SS subseasons (cold = late green-up, early autumn; warm = early spring,
# autumn peak in late autumn/early winter; tropical = wet/dry subseasons). This is also the proposed season
# class for ask 21 (tropical vs temperate from climate, not from the parent biome).
# winter: snow | mild (C3 grass stays green) | summer_dry (grass cures in summer, greens with winter rain) | dry.

