# Species phenology: leaf colour through the year for every deciduous tree/shrub used in a profile (2026-10-28).
# Region leaf palettes are derived from this (weighted by the region's species weights per leaf block), so a region
# needs a hand-written leaf palette only where it departs from its species. Grass palettes are per region
# (region_grass.yaml), because grass colour follows climate rather than species.
# Keys: spring = leaf-out flush, summer, early_autumn, autumn = peak, late_autumn, winter.
# "bare" = leafless (hold until next key). "marcescent" values = dead leaves kept on the tree over winter.
# summer omitted = keep the db `leaf` colour. Sources: field guides and phenology records (USA-NPN, PEP725,
# Japan Meteorological Agency kōyō records); colours are estimates of the canopy as seen from a distance.

evergreen_flag_fixes:   # marked deciduous in the db but evergreen in reality: they currently turn red in autumn
  [coast_live_oak, chamise, coconut_palm, joshua_tree, faxon_yucca, hainan_hopea, lychee, manzanita, pacific_madrone,
   schima, moso_bamboo, rosebay_rhododendron, hengduan_rhododendron, chinese_banyan]
special:                # neither: hold colour, no autumn shift, but not a true evergreen canopy
  palo_verde: {all: "#8ab040"}          # green bark; leaflets drop in drought but the tree stays green
  saxaul: {all: "#8a9a6a"}              # leafless green twigs
  tamarisk: {spring: "#9ab890", summer: "#8aa880", autumn: "#b08850", winter: bare}

