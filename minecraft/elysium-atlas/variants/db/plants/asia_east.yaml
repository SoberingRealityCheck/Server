# Plants of East Asia: Mongolia and the Chinese deserts, northeast China and the Russian Far East, North and
# South China, Korea, Japan and Taiwan.
# Schema: see ../README.md. Colours follow the species' usual description (leaf_note / colour_note);
# they are not measured from photographs. Circumboreal species (bluejoint, fireweed, ostrich fern, Scots pine,
# shrubby cinquefoil ...) are reused from the North American, European and Tibetan files.

# ---------------------------------------------------------------- northern conifers
dahurian_larch:
  name: Dahurian larch
  latin: Larix gmelinii
  form: tree
  leaf: pale_yellow_green
  leaf_note: Soft light-green deciduous needles in tufts; gold in autumn.
  autumn: "#d0a83a"
  range: Permafrost taiga of eastern Siberia, the Greater Khingan and the Amur.
  render: 'tree("spruce_log", "birch_leaves", straight(7, 3, 0), sprucef(U(1, 2), U(0, 1), U(2, 3)))'
  sapling: spruce_sapling
  stand_in: Birch leaves on a spruce trunk for the pale deciduous needles.

siberian_larch:
  name: Siberian larch
  latin: Larix sibirica
  form: tree
  leaf: "#86b050"
  leaf_note: Light green deciduous needles in tufts.
  autumn: "#d0a83a"
  range: Altai, Sayan, Khangai and the north-facing slopes of the Mongolian forest steppe.
  render: 'tree("spruce_log", "birch_leaves", straight(8, 3, 0), sprucef(U(1, 2), U(0, 1), U(2, 4)))'
  sapling: spruce_sapling
  stand_in: Birch leaves on a spruce trunk.

japanese_larch:
  name: Japanese larch
  latin: Larix kaempferi
  form: tree
  leaf: "#7aa84e"
  leaf_note: Blue-tinged light green deciduous needles.
  autumn: "#c8902e"
  range: Subalpine central Honshu; planted widely in Japan.
  render: 'tree("spruce_log", "birch_leaves", straight(8, 3, 1), sprucef(U(1, 2), U(0, 1), U(2, 4)))'
  sapling: spruce_sapling
  stand_in: Birch leaves on a spruce trunk.

siberian_pine:
  name: Siberian pine
  latin: Pinus sibirica
  form: tree
  leaf: "#3e6438"
  leaf_note: Dark green needles in fives.
  range: Altai, Sayan and Khangai mountain taiga.
  render: 'tree("spruce_log", "spruce_leaves", straight(9, 3, 1), blob(2, 4, 0))'
  sapling: spruce_sapling

korean_pine:
  name: Korean pine
  latin: Pinus koraiensis
  form: tree
  leaf: "#3e6440"
  leaf_note: Dark green needles in fives, blue-white below.
  range: Mixed forests of Manchuria, the Ussuri, Changbai and Korea.
  render: 'ref("biomesoplenty:pine_tree")'
  sapling: spruce_sapling
  stand_in: Biomes O' Plenty pine.

siberian_spruce:
  name: Siberian spruce
  latin: Picea obovata
  form: tree
  leaf: dark_blue_green
  leaf_note: Short dark green needles.
  range: Taiga of Siberia, the Altai and the Khangai.
  render: 'ref("spruce")'
  sapling: spruce_sapling

yezo_spruce:
  name: Yezo spruce
  latin: Picea jezoensis
  form: tree
  leaf: "#3a5e44"
  leaf_note: Flat dark green needles, silver-white below.
  range: Hokkaido, Sakhalin, the Sikhote-Alin and Changbai, subalpine.
  render: 'ref("biomesoplenty:tall_spruce_tree")'
  sapling: spruce_sapling
  stand_in: Biomes O' Plenty tall spruce.

khingan_fir:
  name: Khingan fir
  latin: Abies nephrolepis
  form: tree
  leaf: fir_green
  leaf_note: Dark glossy needles.
  range: Changbai, the Ussuri and northern Korea, with Korean pine and Yezo spruce.
  render: 'ref("biomesoplenty:fir_tree")'
  sapling: biomesoplenty:fir_sapling
  stand_in: Biomes O' Plenty fir.

sakhalin_fir:
  name: Sakhalin fir
  latin: Abies sachalinensis
  form: tree
  leaf: "#3a684c"
  leaf_note: Dark glossy needles.
  range: Hokkaido, Sakhalin and the southern Kurils.
  render: 'ref("biomesoplenty:fir_tree_large")'
  sapling: biomesoplenty:fir_sapling
  stand_in: Biomes O' Plenty large fir.

veitch_fir:
  name: Veitch's fir
  latin: Abies veitchii
  form: tree
  leaf: "#3c6a4c"
  leaf_note: Dark green needles with chalk-white bands below.
  range: Subalpine forest of Honshu and Shikoku, with Maries' fir.
  render: 'ref("biomesoplenty:fir_tree_small")'
  sapling: biomesoplenty:fir_sapling
  stand_in: Biomes O' Plenty small fir.

siberian_dwarf_pine:
  name: Siberian dwarf pine
  latin: Pinus pumila
  form: shrub
  clump: {size: 20, share: 0.5}
  leaf: "#3e6a44"
  leaf_note: Dark blue-green needles in fives on prostrate stems.
  range: Above the treeline in Japan, Kamchatka, the Kurils and northeast Siberia; the Bald Mountains.
  render: 'tree("spruce_log", "spruce_leaves", straight(1, 0, 0), bushf(2, 1, 0))'
  sapling: spruce_sapling

schrenk_spruce:
  name: Schrenk's spruce
  latin: Picea schrenkiana
  form: tree
  leaf: "#3a6048"
  leaf_note: Blue-green needles on a narrow spire.
  range: North slopes of the Tian Shan, 1,500-2,800 m.
  look: Very narrow column.
  render: 'ref("biomesoplenty:tall_spruce_tree")'
  sapling: spruce_sapling
  stand_in: Biomes O' Plenty tall spruce.

qinghai_spruce:
  name: Qinghai spruce
  latin: Picea crassifolia
  form: tree
  leaf: "#4a6a58"
  leaf_note: Thick blue-grey needles.
  range: Shady slopes of the Qilian, Helan and eastern plateau ranges.
  render: 'ref("spruce")'
  sapling: spruce_sapling

przewalski_juniper:
  name: Qilian juniper
  latin: Juniperus przewalskii
  form: tree
  leaf: glaucous_blue_green
  leaf_note: Grey-green scale leaves.
  range: Sunny slopes of the Qilian and northeastern plateau.
  render: 'ref("wilderwild:juniper")'
  sapling: spruce_sapling
  stand_in: Wilder Wild juniper.

balfour_spruce:
  name: Likiang spruce
  latin: Picea likiangensis
  form: tree
  leaf: "#3c6448"
  leaf_note: Blue-green needles.
  range: Hengduan Mountains and northwest Yunnan, 2,500-4,100 m.
  render: 'ref("biomesoplenty:tall_spruce_tree")'
  sapling: spruce_sapling
  stand_in: Biomes O' Plenty tall spruce.

faber_fir:
  name: Faber's fir
  latin: Abies fabri
  form: tree
  leaf: fir_green
  leaf_note: Dark glossy needles, white below.
  range: Subalpine Sichuan (Emei, Gongga, Wolong) to the treeline.
  render: 'ref("biomesoplenty:fir_tree_large")'
  sapling: biomesoplenty:fir_sapling
  stand_in: Biomes O' Plenty large fir.

chinese_pine:
  name: Chinese pine
  latin: Pinus tabuliformis
  form: tree
  leaf: deep_green_pine
  leaf_note: Dark green needles in pairs; crown flattens with age.
  range: Mountains of North China, the Loess Plateau and the Qinling.
  render: 'tree("spruce_log", "spruce_leaves", forking(5, 2, 1), blob(2, 2, 0))'
  sapling: spruce_sapling

chinese_arborvitae:
  name: Chinese arborvitae
  latin: Platycladus orientalis
  form: tree
  leaf: "#3c5e34"
  leaf_note: Flat vertical sprays of dark green scale leaves.
  range: Dry limestone and loess slopes of North China.
  render: 'tree("spruce_log", "spruce_leaves", straight(4, 2, 0), blob(2, 3, 0))'
  sapling: spruce_sapling

japanese_red_pine:
  name: Japanese red pine
  latin: Pinus densiflora
  form: tree
  leaf: "#4e7a3c"
  leaf_note: Soft bright green needles in pairs.
  range: Dry ridges and disturbed ground in Japan, Korea and northeast China.
  look: Red-orange upper bark, leaning trunk.
  render: 'tree("acacia_log", "spruce_leaves", forking(6, 2, 1), blob(2, 2, 0))'
  sapling: spruce_sapling
  stand_in: Acacia log for the orange bark.

japanese_black_pine:
  name: Japanese black pine
  latin: Pinus thunbergii
  form: tree
  leaf: "#365a34"
  leaf_note: Stiff dark green needles in pairs.
  range: Coasts of Japan and southern Korea.
  render: 'tree("dark_oak_log", "spruce_leaves", forking(4, 2, 1), acaciaf(2))'
  sapling: spruce_sapling

japanese_cedar:
  name: Japanese cedar
  latin: Cryptomeria japonica
  form: tree
  leaf: "#3e6a3a"
  leaf_note: Dark green awl-shaped needles; bronze in winter.
  range: Wet mountain slopes of Japan (Yakushima, Tohoku Sea of Japan side).
  look: Tall straight red-brown trunk.
  render: 'ref("terrestria:redwood_tree")'
  sapling: terrestria:redwood_sapling
  stand_in: Terrestria redwood, a related tree.

hinoki:
  name: Hinoki cypress
  latin: Chamaecyparis obtusa
  form: tree
  leaf: "#3a6a3a"
  leaf_note: Blunt dark green scale leaves with white Y marks below.
  range: Montane forests of central and southern Japan.
  render: 'ref("terrestria:cypress_tree")'
  sapling: terrestria:cypress_sapling
  stand_in: Terrestria cypress.

taiwan_cypress:
  name: Taiwan red cypress
  latin: Chamaecyparis formosensis
  form: tree
  leaf: "#3e6a3e"
  leaf_note: Pointed yellow-green to dark green scale leaves.
  range: Cloud forest of the Taiwan Central Range, 1,500-2,500 m.
  render: 'ref("terrestria:cypress_tree")'
  sapling: terrestria:cypress_sapling
  stand_in: Terrestria cypress.

japanese_hemlock:
  name: Japanese hemlock
  latin: Tsuga sieboldii
  form: tree
  leaf: "#3a6444"
  leaf_note: Short glossy needles.
  range: Ridges of southern Honshu, Shikoku and Kyushu.
  render: 'ref("terrestria:hemlock_tree")'
  sapling: terrestria:hemlock_sapling
  stand_in: Terrestria hemlock.

chinese_fir:
  name: Chinese fir
  latin: Cunninghamia lanceolata
  form: tree
  leaf: "#4e7440"
  leaf_note: Stiff lance-shaped glossy green needles.
  range: Hills of southern China and northern Vietnam.
  render: 'tree("spruce_log", "spruce_leaves", straight(9, 3, 0), sprucef(U(2, 3), U(0, 1), U(2, 4)))'
  sapling: spruce_sapling

masson_pine:
  name: Masson's pine
  latin: Pinus massoniana
  form: tree
  leaf: yellow_green_pine
  leaf_note: Long slender light green needles in pairs.
  range: Dry hills of central and southern China.
  render: 'ref("biomesoplenty:pine_tree")'
  sapling: spruce_sapling
  stand_in: Biomes O' Plenty pine.

yunnan_pine:
  name: Yunnan pine
  latin: Pinus yunnanensis
  form: tree
  leaf: "#5a7e44"
  leaf_note: Long drooping needles in threes.
  range: Yunnan-Guizhou Plateau and the lower Hengduan.
  render: 'tree("spruce_log", "spruce_leaves", straight(9, 3, 1), pinef(2, U(4, 5)))'
  sapling: spruce_sapling

# ---------------------------------------------------------------- northern broadleaves
mongolian_oak:
  name: Mongolian oak
  latin: Quercus mongolica
  form: tree
  leaf: deep_green
  leaf_note: Large wavy-lobed leaves; brown and held in winter.
  range: Northeast China, the Russian Far East, Korea and Hokkaido; dry ridges and forest steppe.
  render: 'tree("oak_log", "oak_leaves", fancy(6, 3, 0), fancyf(2, 4, 4), size=FANCY_SIZE)'
  sapling: oak_sapling

liaodong_oak:
  name: Liaodong oak
  latin: Quercus wutaishanica
  form: tree
  leaf: "#4e8434"
  leaf_note: Lobed dark green leaves.
  range: Mountains of North China and the Loess Plateau.
  render: 'tree("oak_log", "oak_leaves", forking(4, 2, 1), blob(3, 2, 0))'
  sapling: oak_sapling

konara_oak:
  name: Konara oak
  latin: Quercus serrata
  form: tree
  leaf: "#5a9a3a"
  leaf_note: Toothed glossy leaves, silky below.
  range: Lowland deciduous woods of Japan, Korea and eastern China.
  render: 'tree("oak_log", "oak_leaves", straight(6, 3, 0), blob(2, 3, 0))'
  sapling: oak_sapling

japanese_beech:
  name: Siebold's beech
  latin: Fagus crenata
  form: tree
  clump: {size: 30, share: 0.55}
  leaf: fresh_green
  leaf_note: Thin bright green wavy-edged leaves.
  range: Montane forest of Japan, especially the snowy Sea of Japan side.
  render: 'tree("terrestria:rubber_log", "oak_leaves", fancy(7, 4, 0), fancyf(2, 4, 4), size=FANCY_SIZE)'
  sapling: oak_sapling
  stand_in: Pale oak log for the smooth grey bark.

amur_linden:
  name: Amur linden
  latin: Tilia amurensis
  form: tree
  leaf: "#5a9a3c"
  leaf_note: Heart-shaped mid-green leaves.
  range: Mixed forests of Manchuria, the Ussuri and Korea.
  render: 'tree("oak_log", "oak_leaves", fancy(7, 3, 0), fancyf(2, 4, 4), size=FANCY_SIZE)'
  sapling: oak_sapling

manchurian_ash:
  name: Manchurian ash
  latin: Fraxinus mandshurica
  form: tree
  niche: {water: riparian}
  leaf: "#5a9440"
  leaf_note: Large pinnate leaves.
  range: Valley floors and river terraces of the Amur, Ussuri, Korea and Hokkaido.
  render: 'tree("oak_log", "jungle_leaves", straight(9, 3, 0), blob(2, 3, 0))'
  sapling: oak_sapling
  stand_in: Jungle leaves for the compound leaf.

mono_maple:
  name: Painted maple
  latin: Acer pictum
  form: tree
  leaf: "#5c9a3a"
  leaf_note: Five- to seven-lobed bright green leaves; yellow in autumn.
  autumn: "#e0b030"
  range: Mixed and deciduous forests from the Amur to Japan.
  render: 'tree("oak_log", "jungle_leaves", fancy(6, 3, 0), fancyf(2, 4, 4), size=FANCY_SIZE)'
  sapling: oak_sapling
  stand_in: Jungle leaves for the broad maple leaf; no permanent autumn leaf blocks.

japanese_maple:
  name: Japanese maple
  latin: Acer palmatum
  form: tree
  clump: {size: 12, share: 0.3}
  leaf: "#6aa43a"
  leaf_note: Deeply cut light green leaves; scarlet in autumn.
  autumn: "#c83a2a"
  range: Understorey and stream sides in Japan, Korea and eastern China.
  render: 'tree("oak_log", "jungle_leaves", forking(3, 1, 1), blob(2, 2, 0))'
  sapling: oak_sapling
  stand_in: Jungle leaves; no permanent red maple blocks.

asian_white_birch:
  name: Asian white birch
  latin: Betula platyphylla
  form: tree
  clump: {size: 24, share: 0.45}
  leaf: yellow_green
  leaf_note: Triangular bright green leaves.
  range: Burns and clearings from Siberia to Hokkaido; the forest steppe of Mongolia.
  render: 'ref("birch")'
  sapling: birch_sapling

erman_birch:
  name: Erman's birch
  latin: Betula ermanii
  form: tree
  leaf: "#6a9e48"
  leaf_note: Dark-veined green leaves; pinkish peeling bark.
  range: The birch belt at the treeline in Japan, Changbai, Kamchatka and Sakhalin.
  look: Low crooked trunks bent by snow.
  render: 'ref("wilderwild:short_birch")'
  sapling: birch_sapling
  stand_in: Wilder Wild short birch.

japanese_cherry:
  name: Hill cherry
  latin: Prunus jamasakura
  form: tree
  clump: {size: 10, share: 0.2}
  leaf: "#5a8e3a"
  leaf_note: Bronze-red young leaves turning green; pink-white blossom in April. In game the untinted cherry leaves show blossom all year (Clay, 2026-10-28); this colour only feeds the foliage mean.
  range: Hill forests of Honshu, Shikoku and Kyushu.
  render: 'ref("cherry")'
  sapling: cherry_sapling
  stand_in: Vanilla cherry tree; cherry leaves are pink in every season.

japanese_zelkova:
  name: Japanese zelkova
  latin: Zelkova serrata
  form: tree
  niche: {water: riparian}
  leaf: "#5a9a3e"
  leaf_note: Toothed mid-green leaves on a vase-shaped crown.
  range: Valleys of Japan, Korea and eastern China.
  render: 'tree("oak_log", "jungle_leaves", fancy(8, 3, 0), fancyf(2, 4, 4), size=FANCY_SIZE)'
  sapling: oak_sapling

siberian_elm:
  name: Siberian elm
  latin: Ulmus pumila
  form: tree
  leaf: "#5e9440"
  leaf_note: Small rough dark green leaves.
  range: Sandy plains, steppe valleys and the North China Plain.
  render: 'tree("oak_log", "oak_leaves", forking(4, 2, 1), blob(2, 2, 0))'
  sapling: oak_sapling

chinese_scholar_tree:
  name: Pagoda tree
  latin: Styphnolobium japonicum
  form: tree
  leaf: "#5a9644"
  leaf_note: Pinnate dark green leaflets.
  range: The North China Plain and the Loess valleys.
  render: 'tree("oak_log", "jungle_leaves", forking(5, 2, 1), blob(3, 2, 0))'
  sapling: oak_sapling

euphrates_poplar:
  name: Euphrates poplar
  latin: Populus euphratica
  form: tree
  niche: {water: riparian}
  leaf: "#7a9a6a"
  leaf_note: Grey-green leathery leaves, willow-like when young.
  range: Tugai forests along the Tarim, Ejin and desert rivers.
  look: Gnarled, half-dead trunks.
  render: 'tree("oak_log", "acacia_leaves", forking(3, 1, 1), acaciaf(2))'
  sapling: oak_sapling

asian_willow:
  name: Korean willow
  latin: Salix koreensis
  form: tree
  niche: {water: riparian}
  leaf: silvery_green
  leaf_note: Narrow leaves, pale below.
  range: Rivers of Korea, northeast China and the Ussuri.
  render: 'ref("biomesoplenty:willow_tree")'
  sapling: oak_sapling
  stand_in: Biomes O' Plenty willow.

japanese_alder:
  name: Japanese alder
  latin: Alnus japonica
  form: tree
  niche: {water: wet}
  leaf: "#4e8a3a"
  leaf_note: Dark glossy leaves.
  range: Wetlands and paddy edges of Japan, Korea and the Ussuri.
  render: 'tree("dark_oak_log", "oak_leaves", straight(6, 2, 0), blob(2, 3, 0))'
  sapling: oak_sapling

sweetgum_formosan:
  name: Formosan sweetgum
  latin: Liquidambar formosana
  form: tree
  leaf: "#5a9a3a"
  leaf_note: Three-lobed leaves; red in autumn.
  autumn: "#b8402a"
  range: Secondary forest of central and southern China and Taiwan.
  render: 'tree("oak_log", "jungle_leaves", fancy(8, 3, 0), fancyf(2, 4, 4), size=FANCY_SIZE)'
  sapling: oak_sapling

# ---------------------------------------------------------------- evergreen broadleaves
castanopsis:
  name: Chinquapin
  latin: Castanopsis sieboldii
  form: tree
  evergreen: true
  leaf: dark_glossy_green
  leaf_note: Leathery dark green leaves with golden-brown undersides.
  range: Laurel forest of southern Japan, southern Korea and eastern China (C. eyrei, C. carlesii).
  render: 'tree("dark_oak_log", "dark_oak_leaves", straight(5, 2, 0), blob(3, 3, 0))'
  sapling: oak_sapling

ring_cup_oak:
  name: Ring-cup oak
  latin: Quercus glauca
  form: tree
  evergreen: true
  leaf: "#3a6a30"
  leaf_note: Glossy dark leaves, grey-white below.
  range: Evergreen forest from southern Japan to the Himalaya.
  render: 'tree("dark_oak_log", "jungle_leaves", straight(6, 2, 0), blob(2, 3, 0))'
  sapling: oak_sapling

camphor_tree:
  name: Camphor tree
  latin: Cinnamomum camphora
  form: tree
  evergreen: true
  leaf: "#5a8a3a"
  leaf_note: Glossy yellow-green leaves, pink-red when new.
  range: Lowlands of southern China, Taiwan, southern Japan and Korea.
  look: Broad dome, huge old trunks.
  render: 'tree("oak_log", "jungle_leaves", fancy(7, 3, 0), fancyf(2, 4, 4), size=FANCY_SIZE)'
  sapling: oak_sapling

machilus:
  name: Red machilus
  latin: Machilus thunbergii
  form: tree
  evergreen: true
  leaf: "#34602e"
  leaf_note: Thick glossy dark leaves.
  range: Coastal laurel forest of Japan, Korea, Taiwan and eastern China.
  render: 'tree("dark_oak_log", "dark_oak_leaves", forking(4, 2, 1), blob(3, 2, 0))'
  sapling: oak_sapling

schima:
  name: Schima
  latin: Schima superba
  form: tree
  leaf: "#3e6e32"
  leaf_note: Glossy dark green leaves; white camellia-like flowers.
  range: Hills of southern China and Taiwan.
  render: 'tree("oak_log", "dark_oak_leaves", straight(7, 3, 0), blob(2, 3, 0))'
  sapling: oak_sapling

chinese_banyan:
  name: Chinese banyan
  latin: Ficus microcarpa
  form: tree
  leaf: "#3e7030"
  leaf_note: Small glossy dark leaves.
  range: Lowlands of Hainan, Taiwan, Guangdong and Guangxi.
  render: 'tree("jungle_log", "jungle_leaves", forking(5, 2, 1), blob(3, 3, 0), decorators=[leave_vine(0.25)])'
  sapling: jungle_sapling

hainan_hopea:
  name: Hainan hopea
  latin: Hopea hainanensis
  form: tree
  leaf: "#3a6a30"
  leaf_note: Leathery dark green leaves.
  range: Lowland monsoon forest of Hainan and northern Vietnam.
  look: Tall emergent dipterocarp.
  render: 'ref("mega_jungle_tree")'
  sapling: jungle_sapling
  stand_in: Vanilla mega jungle tree.

lychee:
  name: Wild lychee
  latin: Litchi chinensis
  form: tree
  leaf: "#3e6a30"
  leaf_note: Glossy pinnate leaves.
  range: Lowland forest of Hainan and Guangdong.
  render: 'ref("jungle_tree")'
  sapling: jungle_sapling
  stand_in: Vanilla jungle tree.

coconut_palm:
  name: Coconut palm
  latin: Cocos nucifera
  form: tree
  niche: {elevation: [0, 60]}
  leaf: "#6a9a3a"
  leaf_note: Yellow-green feather fronds.
  range: Tropical coasts of Hainan and Taiwan.
  render: 'ref("biomesoplenty:palm_tree")'
  sapling: biomesoplenty:palm_sapling
  stand_in: Biomes O' Plenty palm.

moso_bamboo:
  name: Moso bamboo
  latin: Phyllostachys edulis
  form: tree
  clump: {size: 28, share: 0.35}
  leaf: "#7aaa3a"
  leaf_note: Small light green leaves on very tall culms.
  range: Hills of the Yangtze basin, Fujian, Zhejiang and Jiangxi.
  render: 'ref("bamboo_no_podzol")'
  sapling: oak_sapling
  stand_in: Vanilla bamboo.

# ---------------------------------------------------------------- shrubs
caragana_microphylla:
  name: Littleleaf pea shrub
  latin: Caragana microphylla
  form: shrub_ground
  clump: {size: 14, share: 0.35}
  range: Sandy steppe of Inner Mongolia and Mongolia.
  render: 'flowers("bush", "dead_bush", weights=[3, 1])'

fringed_sagebrush:
  name: Fringed sagewort
  latin: Artemisia frigida
  form: shrub_ground
  range: Overgrazed and dry steppe from Mongolia to Kazakhstan.
  render: 'flowers("short_dry_grass", "bush", weights=[2, 1])'

ordos_sagebrush:
  name: Ordos sagebrush
  latin: Artemisia ordosica
  form: shrub_ground
