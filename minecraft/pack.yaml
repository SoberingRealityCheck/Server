      null server-side), and that fault is invisible to --check-deps
      because it is a runtime NPE, not a declared dependency. 3.3.0 was
      the first stable (non-beta) release for 26.2.
      Do NOT upgrade to 3.3.3 yet: on a fresh world the dedicated
      server hangs forever on "Preparing level" (the Server thread
      waits on the spawn chunk and nothing generates it). Reproduced
      three times, with and without Streams Reflowing. 3.3.2 and
      3.2.0-b boot fine on the same pack. Retest on the next release.

