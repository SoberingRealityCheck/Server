# Shader packs are GLSL for the player's GPU, so they are always
# client-only -- the server has no renderer. Iris (in `mods` above)
# loads them.
#
# Shipped but NOT enabled: the .mrpack places the file in shaderpacks/
# and players turn it on under Video Settings -> Shaders. Enabling by
# default would mean a laptop GPU meets a 60->15 fps drop on first
# launch and reads it as the pack being broken.
shaderpacks:
  - name: "Complementary Shaders - Reimagined"
    file: "ComplementaryReimagined_r5.8.1.zip"
    url: "https://cdn.modrinth.com/data/HVnmMxH1/versions/yCCduG44/ComplementaryReimagined_r5.8.1.zip"
    sha512: "6bd95215755d25812556ce790d976221f7d677d63112e3e4d3e70b08a62ed41348fa3792dd31bbe720d1e46fe2d525cadb4f66e6358118e1f4aa8e0d11f25c39"
    reason: >-
      Vanilla-preserving shader pack. r5.8 added Distant Horizons
      support -- LOD terrain gets shadows and proper water reflections
      -- which matters here since DH is the pack's headline feature.
      Note that DH 3.2.0's new LOD textures apply to base DH rendering
      only; under Iris, distant LODs render untextured. Ships with
      Potato through Ultra profiles for weaker hardware.

  - name: "BSL Shaders"
    file: "BSL_v10.1.3.zip"
    url: "https://cdn.modrinth.com/data/Q1vvjJYV/versions/hIibTfxn/BSL_v10.1.3.zip"
    sha512: "3e68c8038e38b0860cf1258e5fc84bcd98007a70fb7ba49e306186be6e905187527b630b77cb9e8cc8ee80865606c0fb398c419a22f0076b2ed5c7d73748a9ba"
    reason: >-
      Warmer, more stylised look than Complementary -- which began life
      as a BSL edit, so the two share a lineage and settings layout.
      Built for 26.2 (published April 2026).

  - name: "Bliss"
    file: "Bliss_v2.1.2_(Chocapic13_Shaders_edit).zip"
    url: "https://cdn.modrinth.com/data/ZvMtQlho/versions/kC2Y8q1P/Bliss_v2.1.2_%28Chocapic13_Shaders_edit%29.zip"
    sha512: "dafc60be4980ec40f40edc0f2625cb0976f3c9ce5ed86383146a120480826bb1de70ef5e38b7f1437294ed4d38c6ef3c82ebef0ae4e00b8cee165788c9c18280"
    reason: >-
      Chocapic13 edit with volumetric lighting and a colder, more
      atmospheric look. Caveat: this build is from November 2025 and the
      author added 26.2 to its compatibility list afterwards rather than
      rebuilding for it -- it is the only 26.2-declared release. Treat it
      as the least-proven of the three on this Minecraft version.

# Datapacks are ordinary pack files with a different destination path.
# They land in world/datapacks/ and are picked up when the world
# generates. Server-side only -- clients receive datapack content over
# the network.
datapacks:
  - name: "Matcha Flavoured"
    file: "Matcha_Flavoured.zip"
    url: "https://cdn.modrinth.com/data/QI0EmgZ1/versions/RVX0a6It/Matcha_Flavoured.zip"
    sha512: "12dc5a600d473f06a44a4370c02b404a0260adf696a591a3fbb0f135bca613ffba4f9990f625746375fa9181bbb300eeffd9cc420e6a50f91a48c21314c81505"
    # Combined data + resource pack: one zip, read by the server as data
    # and by the client as assets. Without the client half, players see
    # missing textures and raw lang keys for the ~50 added foods, alloys,
    # and tool sets.
    #
    # This flag makes build.py emit dist/resourcepack.env, which
    # docker-compose.yml loads -- the server then pushes this exact URL
    # and hash to every client on join. Nothing to install by hand and
    # nothing to toggle, and because both values are derived from this
    # entry, the pushed pack always matches the installed data.
    #
    # Only one datapack may set this: server.properties holds a single
    # resource-pack URL.
    resourcepack: true

  - name: "Path Generator Datapack"
    file: "Path-Generator-Datapack262.zip"
    url: "https://cdn.modrinth.com/data/a1wqmF96/versions/kV3ba4GV/Path-Generator-Datapack262.zip"
    sha512: "5b66b37dee927b359dfe91114a20c1980c4d3bf5a96e67ea0313d1c87692ca206a9a0f28a32f554540207e9668bef555ad0391b6e8a1199bd25121dee0f0ac36"
