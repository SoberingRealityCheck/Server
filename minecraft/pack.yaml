  - name: "Treeplacer"
    file: "treeplacer-fabric-26.1_26.2-2.2.0.jar"
    url: "https://cdn.modrinth.com/data/4im8hCxA/versions/PMoUMgR9/treeplacer-fabric-26.1%2026.2-2.2.0.jar"
    sha512: "bc4ef51f8affaf638adb1b4d63f324f3651c753c737349c7abfc97472e85a2a6fec894598c505db7432ab7f60541b992801eca89098f02eefa1eaab3344634a5"
    env: both
    reason: >-
      Lets a datapack choose which tree a sapling grows into, by biome.
      Terralith's trees only exist at worldgen. The datapack lets planted
      saplings use same-wood tree variants suited to their biome, with
      curated similar-biome sources for selected variants and tree-less
      biomes. Saplings never switch wood species. The mapping is
      server-overrides/world/datapacks/z-treeplacer-terralith, generated
      by tools/treeplacer_terralith.py from Terralith's own files. The
      older Terralith add-on for Treeplacer targets Terralith 2.3.5 on
      1.20.1 and is not used. The filename here has an underscore where
      the download has a space, so launchers get a plain path.

