  - name: "Serene Seasons"
    file: "SereneSeasons-fabric-26.2-26.1.2.0.6.jar"
    url: "https://cdn.modrinth.com/data/e0bNACJD/versions/q5mzi8wy/SereneSeasons-fabric-26.2-26.1.2.0.6.jar"
    sha512: "fe468f4268f00d86a1cafb75db9fbcd8e7e03ecd6de5ebf74a4c775dc45895fa9a597d569ef24d6f537b0cb1f5160808eb82912da05e47397ca7ce193d0e96de"
    env: both
    reason: >-
      Seasons: winter snow and ice, seasonal foliage color and crop
      fertility. Required on both sides. Sorts biomes with four tags
      that only list vanilla biomes, so Terralith is taught to it by
      server-overrides/world/datapacks/z-seasons-terralith -- see README.
      CAUTION: beta, built for 26.1.2 and flagged as working on 26.2.

  - name: "Season Cache"
    file: "seasoncache-1.3.1+26.2.2.jar"
    url: "https://github.com/SoberingRealityCheck/season-cache/releases/download/v1.3.1-26.2.2/seasoncache-1.3.1%2B26.2.2.jar"
    sha512: "49408a34e10d54573b0b5ca1ce5eeb9ef1dd0a0cc2192bcd070fd5e9938107360adb1d142328d5d53b71a449f876629aa2d2c07d369bb604fd55f3a2650487a5"
    env: both
    reason: >-
      Keeps placed snow and ice in step with Serene Seasons. On a season
      change it adds snow layers and ice in loaded chunks and melts them
      in spring, nearest the players first. Serene Seasons alone only
      changes snow as weather happens to fall. Also builds a per-chunk
      snow map from the region files and streams it to clients, which
      Nova Reimagined Snow reads. Our 26.2 port of ItsThatNova's mod
      (MIT), source at github.com/SoberingRealityCheck/season-cache.
      The first 26.2 build hung the server thread on chunk load. Fixed in 26.2.1. Still
      lightly tested: watch snow placement and the server log after the
      first season change.

  - name: "Nova Reimagined Snow"
    file: "compsnow-1.0.3+26.2.1.jar"
    url: "https://github.com/SoberingRealityCheck/nova-reimagined-snow/releases/download/v1.0.3-26.2.1/compsnow-1.0.3%2B26.2.1.jar"
    sha512: "3a1a1dc07320397969882e9d13900686eb2534391653a0c322fba2acfc2145d387c9745c47fe112c34ce026c5ebd562ba54a826e945196526ae907f92eb751ef"
    env: client
    reason: >-
      Feeds the Nova Reimagined shader its snow map. Reads what Season
      Cache streams from the server and turns it into textures the
      shader samples. Does nothing unless Nova is the active shader.
      Client only. Our 26.2 port of ItsThatNova's mod (MIT), source at
      github.com/SoberingRealityCheck/nova-reimagined-snow. Loads and
      uploads its textures on macOS. Its Distant Horizons texture slots
      fall back to plain white, because they expect a companion
      resource pack we do not ship.

  - name: "Seasonal LODs"
    file: "ssdh26-1.0.2.jar"
    url: "https://github.com/SoberingRealityCheck/ssdh/releases/download/v1.0.2/ssdh26-1.0.2.jar"
    sha512: "d44a894587740936d61325b951c8852c6ea47620f46050db55b7172a98b48b90f6f9c7e4b76b9747d44933b7ac1a2a749bd9ad6a4d43f924be09937672a30f39"
    env: client
    reason: >-
      Far Distant Horizons terrain follows Serene Seasons. Without it,
      near trees and grass change color with the season and far LODs
      stay stuck on the old colors. Clears DH's color caches on a season
      change, then rebuilds the visible LODs nearest first. Our own mod,
      source at github.com/SoberingRealityCheck/ssdh. Client only: the
      server stores block and biome, never colors. Also publishes the
      ssdh:season_meta and ssdh:season_phase textures that Nova
      Reimagined reads for seasonal Distant Horizons grass.
      Runs a second sweep 20 seconds after each season change, because
      the first one can leave far grass on the old season.

