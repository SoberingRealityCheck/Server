# ModernFix omitted: no Fabric 26.2 build yet.

# Shader packs are GLSL for the player's GPU, so they are always
# client-only -- the server has no renderer. Iris (in `mods` above)
# loads them.
#
# Shipped but NOT enabled: the .mrpack places the file in shaderpacks/
# and players turn it on under Video Settings -> Shaders. Enabling by
# default would mean a laptop GPU meets a 60->15 fps drop on first
# launch and reads it as the pack being broken.
#
# Two shaders, and Nova Reimagined is the experiment. Bliss never loaded
# on macOS (Iris ran out of texture units) and BSL and RedHat were
# dropped to keep a tested look. Recommended settings are in the README, not shipped: a
# launcher can re-apply override files on an update and wipe a player's
# own tweaks.
shaderpacks:
  - name: "Complementary Shaders - Reimagined"
    file: "ComplementaryReimagined_r5.9.3.zip"
    url: "https://cdn.modrinth.com/data/HVnmMxH1/versions/Bqen1mJX/ComplementaryReimagined_r5.9.3.zip"
    sha512: "45304b1d7862afdb2177b7e6226fc9c6737911d17a4ad46cc9c519ca4deb935f05072cd337cd8b19a15bb8062b57b54eceec7bdee4cd572d94858e2946d37d85"
    reason: >-
      Vanilla-preserving shader pack. r5.8 added Distant Horizons
      support -- LOD terrain gets shadows and proper water reflections
      -- which matters here since DH is the pack's headline feature.
      Note that DH's new LOD textures (3.2.0 on) apply to base DH rendering
      only; under Iris, distant LODs render untextured. Ships with
      Potato through Ultra profiles for weaker hardware.
      Recommended settings are in the README. Water reflections are best
      set to sky-only, because the screen-space ones smear under tree
      canopies.

  - name: "Nova Reimagined"
    file: "NovaReimagined_v1.0.3.zip"
    url: "https://cdn.modrinth.com/data/Uzkg6HgX/versions/FENoHvT5/NovaReimagined_v1.0.3.zip"
    sha512: "4a7804e2c40358a478bf7cfc4fe26d314fca7f43bf88b9c903a7ae33d842577e5649855249d1aac9b04f813cede4ed1bb04948c719019f79b749ee89091049b1"
    reason: >-
      Complementary Reimagined with a snow system that follows the
      season: snow builds on terrain, leaves and wood, and on Distant
      Horizons terrain too. Reads the snow map from Season Cache and
      Nova Reimagined Snow. Without those it falls back to a guess from
      the player's position. Upstream lists support up to 1.21.11 but the
      shader is plain GLSL, so we pin the upstream zip as is. We may not
      modify it: the Complementary License allows a modpack to include
      the pack only unmodified. macOS: 1.0.3 does NOT load as shipped.
      Three upstream problems, found by testing on an M4 Mac. (1) It
      asks for shader storage buffers when World-Space Reflections is
      on, which is the default, and macOS has none. (2) The line
      `float thunderFactor = GetThunderFactor();` in
      lib/colors/lightAndAmbientColors.glsl crashes Apple's GL
      compiler. (3) Distant Horizons terrain needs 21 samplers and
      macOS allows 16. Settings fix 1 and 3, only a code change fixes
      2. Windows and Linux are untested. If it fails, use the
      Complementary entry above.

# Installed client-side as an optional resource pack; launchers cannot
# enable it automatically. Players turn it on under Options -> Resource Packs.
resourcepacks:
