    file: "DynamicSurroundings_R24.zip"
    url: "https://cdn.modrinth.com/data/x1a4wWrm/versions/HTxBs1W4/DynamicSurroundings_R24.zip"
    sha512: "7680349efd6fbcd6605252306609279a82d99068b1034cbd3f85da72f4d970636da028cadf4fc954672271c7781e4b9e3144d932a0fcf2cb83225795c8b8f08b"
    reason: >-
      Extra sample replacements for vanilla sounds (footsteps, blocks,
      mobs, items). Used together with AmbientSounds and Presence
      Footsteps, not instead of them. Overlap is untested: both can
      play a footstep or ambient loop at once. GPL-3.0; see its project
      page for credits and asset notes.

# Datapacks are ordinary pack files with a different destination path.
# They land in world/datapacks/ and are picked up when the world
# generates. Server-side only -- clients receive datapack content over
# the network.
datapacks:
  - name: "Matcha Flavoured"
    file: "MF_DP_1_12_3_26_2.zip"
    url: "https://cdn.modrinth.com/data/QI0EmgZ1/versions/o2nmeGGh/MF_DP_1_12_3_26_2.zip"
    sha512: "abe85595904c08ff6c4859308e2e2953564d12782e1daee22feb748760a77e9742543aa3d9e17d46af6674bc6256feace909bb4ed0f1820c05c838c68bd38177"
    # Since 1.12 the author ships the resource pack as its own download
    # (MF_RP_*), separate from the datapack zip. Without it players see
    # missing textures and raw lang keys for the ~50 added foods, alloys,
    # and tool sets.
    #
    # build.py emits dist/resourcepack.env from this block, which
    # docker-compose.yml loads -- the server then pushes this URL and
    # hash to every client on join. Nothing to install by hand.
    #
    # Pinned to 1.12.3, not the newer 1.12.4: the 1.12.4 datapack ships
    # two broken loot tables (a trailing comma in fishing/junk.json and
    # a "name" where a loot-table entry needs "value" in
    # entities/fox.json). Both fail to load on the server, and Sea
    # Life's fish trap depends on the junk table. 1.12.4 fixed armour
    # and tool intrinsics, multiplayer sleep speed, chocolate stacking
    # and fox pelt textures, so 1.12.3 has those bugs instead. Retest
    # when 1.12.5 or later lands.
    #
    # The RP is versioned separately and 1.12.3's matches 1.12.4's
    # (the 1.12.4 changelog says it is unchanged). When a release says
    # the RP changed, bump this block too.
    #
    # Only one datapack may set this: server.properties holds a single
    # resource-pack URL.
    resourcepack:
      file: "MF_RP_1_12_3_26_2.zip"
      url: "https://cdn.modrinth.com/data/QI0EmgZ1/versions/WRkL802v/MF_RP_1_12_3_26_2.zip"
      sha512: "1a5eff90f0f37d572847d8528074c4c6b7bb63089810d2afbae27ee9cc5a06e50fa8d91192a521830ae224af58b914b716b0880ef84057364bd611e49cee05e3"
