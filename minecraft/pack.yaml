# Source of truth for the modpack. `build.py` compiles this into
# dist/pack.mrpack (a Modrinth modpack), which the server installs at
# startup and which players can import directly into the Modrinth App or
# Prism Launcher.
#
# One manifest covers both sides. Each entry's `env` decides where the
# file lands:
#
#   env: both    -> installed on the server AND on players' clients
#   env: server  -> server only; clients never see it
#   env: client  -> client only; the server installer skips it
#
# This replaces the old mods/server + mods/client split, where shared mods
# had to be listed twice and client mods were manual-install-only.
#
# Every entry pins an exact URL and sha512. build.py downloads and
# verifies each one, so a changed or tampered artifact fails the build
# rather than reaching the server.

name: "Elysium"
version: "1.6.1"
summary: >-
  Fabric realistic-terrain profile: Terralith/Tectonic worldgen, Distant
  Horizons LOD rendering, performance and QOL mods, layered under the
  Matcha Flavoured and Path Generator datapacks.

minecraft: "26.2"
loader: fabric

# Java version the server runs under. Mods declare `java` dependencies
# in their fabric.mod.json, and --check-deps resolves them against this.
# Keep it in step with the itzg image tag in ../docker-compose.yml
# (`itzg/minecraft-server:java25`) -- if they drift, the check is
# validating a runtime that does not exist.
java: "25"

# Pin an exact Fabric Loader version for reproducible builds. Set to
# "latest" to have build.py resolve the newest stable release from
# meta.fabricmc.net -- it prints what it resolved so you can pin it here.
loader_version: "latest"

mods:
