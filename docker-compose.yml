# One container. That is the whole stack.
#
# itzg/minecraft-server reads minecraft/dist/pack.mrpack at startup,
# installs the Fabric loader and every server-side mod and datapack the
# pack declares, and runs the server. There is no panel, no database, no
# cache, no daemon -- and so no inter-container networking to go wrong.
#
# Build the pack before the first run:
#   cd minecraft && ./build.py
#
# Then:
#   docker compose up -d
#
# See README.md for the full deploy sequence and aws/NOTES.md for the
# instance and DNS setup this expects.

services:
  minecraft:
    image: itzg/minecraft-server:java25

    # NOT `unless-stopped`. Auto-stop works by letting the container
    # exit when nobody is playing; a restart policy would immediately
    # bring it back and the host would never go idle. Boot-time startup
    # is handled by the minecraft.service systemd unit instead, so
    # nothing is lost -- see aws/systemd/.
    restart: "no"

    # Both needed for `docker attach` to give a working server console.
    # Without them you can still read logs, but not type commands.
    stdin_open: true
    tty: true

    ports:
      - "25565:25565"

    volumes:
      # World, mods, configs, logs -- everything the server writes.
      # Bind-mounted rather than a named volume so backups are a plain
      # tar of a directory you can see.
      - ./data:/data
      # The built pack, read-only. MODRINTH_MODPACK points here.
      - ./minecraft/dist:/modpack:ro

    # RESOURCE_PACK and RESOURCE_PACK_SHA1, generated by build.py from
    # the datapack flagged `resourcepack: true` in pack.yaml. Derived
    # from the same pinned entry the server installs, so the pushed pack
    # and the installed data can never disagree.
    #
    # required: false so a fresh clone can `up` before the first build.
    # Needs Compose v2.24+; older versions error on the long form.
    env_file:
      - path: ./minecraft/dist/resourcepack.env
        required: false

    environment:
      EULA: "TRUE"
      TZ: ${TZ:-UTC}

      # Install from the local .mrpack rather than a published Modrinth
      # project. The .mrpack extension is what makes the image treat this
      # as a file path instead of a project slug.
      TYPE: MODRINTH
      MODRINTH_MODPACK: /modpack/pack.mrpack

      # The image ships a default exclude list that drops mods it thinks
      # are client-only. Our pack already marks sides explicitly via each
      # file's `env`, so let the manifest be authoritative.
      MODRINTH_DEFAULT_EXCLUDE_INCLUDES: ""

      # Heap size. NOT the container's total footprint -- the JVM needs
      # roughly another 1 GB beyond this for metaspace, GC structures and
      # off-heap buffers, so leave headroom under the instance's RAM.
      # See aws/NOTES.md: 4 GB instances are tight for this modpack.
      MEMORY: ${MC_MEMORY:-3G}

      # Aikar's flags: GC tuning widely used for Minecraft servers to
      # avoid long pauses on heaps this size.
      USE_AIKAR_FLAGS: "true"

      MOTD: ${MC_MOTD:-Elysium}
      DIFFICULTY: ${MC_DIFFICULTY:-normal}
      MAX_PLAYERS: ${MC_MAX_PLAYERS:-8}
      VIEW_DISTANCE: ${MC_VIEW_DISTANCE:-10}
      # Distant Horizons renders far terrain client-side from LOD data,
      # so the server does not need a large view distance to make the
      # world look big -- keep this modest to save CPU and RAM.

      OPS: ${MC_OPS:-}
      ENABLE_WHITELIST: ${MC_ENABLE_WHITELIST:-true}
      WHITELIST: ${MC_WHITELIST:-}
      # Whitelist is enforced from this list on every start; edits made
      # in-game via /whitelist are overwritten. Set
      # MC_ENABLE_WHITELIST=false to run open.
      #
      # These must be Minecraft: Java Edition PROFILE NAMES, not Xbox
      # gamertags -- they differ even on the same Microsoft account. A
      # name that cannot be resolved to a UUID aborts startup with
      # "Could not resolve user from Playerdb: <name>" and the container
      # restart-loops. UUIDs are accepted here too, and are immune to
      # both the gamertag confusion and later name changes.
      #
      # Switch to "mojang" if PlayerDB is down or rate-limiting; the two
      # services answer the same question and either can be flaky.
      USER_API_PROVIDER: ${MC_USER_API_PROVIDER:-playerdb}

      # Whether declining the pushed resource pack kicks the player.
      # Left off by default: Matcha Flavoured's textures make its added
      # items legible rather than being purely cosmetic, so enforcing is
      # defensible -- but a failed download then locks someone out
      # entirely, which is a worse first impression than odd textures.
      RESOURCE_PACK_ENFORCE: ${MC_RESOURCE_PACK_ENFORCE:-false}
      RESOURCE_PACK_PROMPT: ${MC_RESOURCE_PACK_PROMPT:-}

      # --- Idle shutdown -------------------------------------------
      # The container stops itself once nobody has been connected for
      # a while. A systemd timer on the host notices the container is
      # gone and powers the instance off, which is what actually stops
      # EC2 billing -- stopping the container alone saves nothing.
      #
      # Touch /data/.skip-stop to suspend this during maintenance; the
      # timer also refuses to shut down while anyone is on SSH.
      ENABLE_AUTOSTOP: ${MC_ENABLE_AUTOSTOP:-true}

      # Seconds after the last player disconnects. Long enough that a
      # quick relog does not trigger a cold start, short enough that an
      # abandoned session is not billed all night.
      AUTOSTOP_TIMEOUT_EST: ${MC_AUTOSTOP_TIMEOUT_EST:-1800}

      # Seconds after startup with nobody ever connecting -- covers a
      # wake that nobody followed through on. Must comfortably exceed
      # this modpack's boot time, which is minutes, not seconds.
      AUTOSTOP_TIMEOUT_INIT: ${MC_AUTOSTOP_TIMEOUT_INIT:-1200}

      # RCON stays on the container's internal port only -- not published
      # above, so it is unreachable from the network. Use
      # `docker compose exec minecraft rcon-cli` for a console.
      ENABLE_RCON: "true"

    healthcheck:
      # Provided by the image; reports healthy once the server answers
      # status pings. `docker compose ps` then tells you whether the
      # server is actually up, not merely whether the process exists.
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      retries: 3
