version: '3.8'

# Single-box Pterodactyl deployment: Panel + its DB/cache, and Wings, all on
# one AWS EC2 host. Wings talks to Panel over localhost, so its management
# API never needs to be exposed publicly -- only Panel's web ports and each
# game server's own port need inbound rules in the AWS security group.
#
# See aws/NOTES.md for instance sizing and the security group table, and
# minecraft/README.md for the first game server that will run under this.

services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    # Panel's PHP MySQL driver expects the older auth plugin; newer
    # MariaDB/MySQL defaults (caching_sha2_password) will make Panel fail
    # to connect on first boot without this override.
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/database:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: ${DB_PASSWORD}

  cache:
    image: redis:7-alpine
    restart: unless-stopped

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - database
      - cache
    volumes:
      - ./data/panel/var:/app/var
      - ./data/panel/nginx:/etc/nginx/http.d
      - ./data/panel/certs:/etc/letsencrypt
      - ./data/panel/logs:/app/storage/logs
    environment:
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_SERVICE_AUTHOR: ${LETSENCRYPT_EMAIL}
      APP_ENV: production
      TRUSTED_PROXIES: "*"
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: cache
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis

  wings:
    image: ghcr.io/pterodactyl/wings:latest
    restart: unless-stopped
    privileged: true
    # host networking so every dynamically-allocated game server port
    # (e.g. Minecraft's 25565, or whatever future games use) is reachable
    # without hand-publishing each one in this compose file.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/wings/etc:/etc/pterodactyl
      - ./data/wings/lib:/var/lib/pterodactyl
      - ./data/wings/logs:/var/log/pterodactyl
      - ./data/wings/tmp:/tmp/pterodactyl
    depends_on:
      - panel
