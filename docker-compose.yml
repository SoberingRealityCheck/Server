# Single-box Pterodactyl deployment: Panel + its DB/cache, and Wings, all on
# one AWS EC2 host. Wings talks to Panel over localhost, so its management
# API never needs to be exposed publicly -- only Panel's web ports and each
# game server's own port need inbound rules in the AWS security group.
#
# See aws/NOTES.md for instance sizing and the security group table, and
# minecraft/README.md for the first game server that will run under this.

services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    # Panel's PHP MySQL driver expects the older auth plugin; newer
    # MariaDB/MySQL defaults (caching_sha2_password) will make Panel fail
    # to connect on first boot without this override.
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/database:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: ${DB_PASSWORD}

  cache:
    image: redis:7-alpine
    restart: unless-stopped

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - database
      - cache
    volumes:
      - ./wings/var:/app/var
      - ./wings/nginx:/etc/nginx/http.d
      - ./wings/certs:/etc/letsencrypt
      - ./wings/logs:/app/storage/logs
      # Forces the mysql CLI client to skip SSL regardless of how it's
      # invoked -- DB_SSLMODE alone doesn't cover the raw shell-out used
      # for schema loading. https://github.com/pterodactyl/panel/issues/5521
      - ./mysql-client-no-ssl.cnf:/etc/my.cnf:ro
    environment:
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_SERVICE_AUTHOR: ${LETSENCRYPT_EMAIL}
      APP_ENV: production
      TRUSTED_PROXIES: "*"
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${DB_PASSWORD}
      # Known regression in the Panel's v1.12.0+ Docker image: the mysql
      # client it now ships defaults to requiring SSL, which this
      # single-host MariaDB container was never configured for (and
      # doesn't need to be -- internal Docker-network-only connection).
      # https://github.com/pterodactyl/panel/issues/5521
      DB_SSLMODE: DISABLED
      REDIS_HOST: cache
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis

  wings:
    image: ghcr.io/pterodactyl/wings:latest
    restart: unless-stopped
    privileged: true
    # host networking so every dynamically-allocated game server port
    # (e.g. Minecraft's 25565, or whatever future games use) is reachable
    # without hand-publishing each one in this compose file.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # config.yml is not in git (it holds node tokens) -- copy
      # wings/config.example.yml here and fill it in. See wings/README.md.
      - ./wings/etc:/etc/pterodactyl
      - ./wings/lib:/var/lib/pterodactyl
      - ./wings/logs:/var/log/pterodactyl
      - ./wings/tmp:/tmp/pterodactyl
    depends_on:
      - panel

# Pinned so Docker's automatic allocation can't collide with the bridge
# network Wings builds for game servers. Docker hands out 172.17/172.18
# first, and Wings defaults to 172.18.0.0/16 -- an unpinned compose network
# takes it first and Wings then dies with "Pool overlaps with other one on
# this address space". Wings is pinned to 172.21.0.0/16 in its own config.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16
